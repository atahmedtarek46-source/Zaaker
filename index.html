<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ذاكر - مساعدك الذكي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <div class="bg-white w-full max-w-md p-4 rounded-xl shadow">
    <h1 class="text-xl font-bold mb-3 text-center">ذاكر 🤖</h1>

    <textarea
      id="question"
      class="w-full border rounded p-2 mb-3"
      rows="4"
      placeholder="اسأل أي سؤال دراسي..."
    ></textarea>

    <button
      onclick="askAI()"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
    >
      اسأل
    </button>

    <div
      id="answer"
      class="mt-4 text-sm whitespace-pre-wrap"
    ></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
